<!DOCTYPE html>
<html>
<head>
    <title>For Krissy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #fff0f3;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }
        h1 {
            color: #c9184a;
            font-size: 28px;
        }
        button {
            margin: 12px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .yes {
            background-color: #ff4d6d;
            color: white;
        }
        .no {
            background-color: #adb5bd;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Krissy, will you be my Valentine? ❤️</h1>

    <button class="yes" onclick="alert('Yay! That made my day ❤️')">
        Yes
    </button>

    <button class="no" onclick="alert('Nice try 😅')">
        No
    </button>

</body>
</html>
